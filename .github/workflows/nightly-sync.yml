name: Nightly Sync Approved Studies

on:
  schedule:
    # Runs every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  # Manual run: from the Actions tab, or "Pubblica ora" in the Sheet's TALEA menu
  workflow_dispatch:
    inputs:
      allow_mass_removal:
        description: 'Allow removing many case studies at once (only if intended)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Two runs at the same time (e.g. "Pubblica ora" pressed twice) wait in line
concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync approved studies from Google Sheet
        env:
          # Protected export through the Apps Script web app (same URL as the form)
          SHEET_EXPORT_URL: ${{ secrets.REACT_APP_GOOGLE_SHEET_URL }}
          SHEET_EXPORT_KEY: ${{ secrets.SHEET_EXPORT_KEY }}
          # Old "Publish to web" CSV, used only while SHEET_EXPORT_KEY is not set
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal }}
        run: node scripts/sync-approved.js

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/data/caseStudies.json public/images)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated case studies and images
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/caseStudies.json public/images
          git commit -m "chore: sync approved case studies from Google Sheet"
          git pull --rebase
          git push

      - name: Build project
        if: steps.changes.outputs.changed == 'true'
        env:
          REACT_APP_GOOGLE_SHEET_URL: ${{ secrets.REACT_APP_GOOGLE_SHEET_URL }}
          REACT_APP_WORKER_URL: ${{ secrets.REACT_APP_WORKER_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
